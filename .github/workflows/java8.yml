name: Integration Tests on Java 8

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 1.8
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: 8
      - name: Build with Maven
        run: ./mvnw --batch-mode --update-snapshots install -Prun-its
